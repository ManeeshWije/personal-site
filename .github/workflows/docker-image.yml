name: Build and Push Nix Container

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Check flake
        run: nix flake check

      - name: Build OCI image with Nix
        run: nix build .#image --print-build-logs

      - name: Load image into Docker daemon
        run: nix run .#image.copyToDockerDaemon

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image tags
        if: github.event_name == 'push'
        env:
          IMAGE: maneeshwije/personal-website
        run: |
          docker tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
